services:
  smart:
    image: ghcr.io/didier57/smart:latest
    container_name: smart
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET:-change-me-avec-une-longue-cle-secrete}
      - PORT=3001
      - LOCAL_DB_PATH=/app/backend/data/smart-local.db
      - ODBC_CONNECTION_STRING=${ODBC_CONNECTION_STRING:-}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER:-admin}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-admin123}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-}
      - TZ=Europe/Paris
    volumes:
      - ${DATA_DIR:-./data}:/app/backend/data
